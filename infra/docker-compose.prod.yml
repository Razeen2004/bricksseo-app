services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: bricks_seo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bricks_seo_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: always
    environment:
      # Explicit ${VAR} substitution, filled in from EasyPanel's Environment tab
      # at compose-parse time (the bare "- VAR" pass-through form was not resolving here).
      - APP_ENV=${APP_ENV}
      - PORT=${PORT}
      - APP_URL=${APP_URL}
      - API_URL=${API_URL}
      - MARKETING_URL=${MARKETING_URL}
      # Always the compose-internal postgres container in prod, regardless of what DATABASE_URL is set to in the panel
      - DATABASE_URL=postgresql://bricks_seo:${POSTGRES_PASSWORD}@postgres:5432/bricks_seo_platform
      - APP_ENCRYPTION_KEYS=${APP_ENCRYPTION_KEYS}
      - LICENSE_KEY_PEPPER=${LICENSE_KEY_PEPPER}
      - PADDLE_ENV=${PADDLE_ENV}
      - PADDLE_API_KEY=${PADDLE_API_KEY}
      - PADDLE_WEBHOOK_SECRET=${PADDLE_WEBHOOK_SECRET}
      - PADDLE_WEBHOOK_TOLERANCE_SECONDS=${PADDLE_WEBHOOK_TOLERANCE_SECONDS}
      - PADDLE_CLIENT_TOKEN=${PADDLE_CLIENT_TOKEN}
      - AUTO_CANCEL_SUBSCRIPTION_ON_REFUND=${AUTO_CANCEL_SUBSCRIPTION_ON_REFUND}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER}
      - EMAIL_FROM=${EMAIL_FROM}
      - ADMIN_ALERT_EMAIL=${ADMIN_ALERT_EMAIL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - STORAGE_DRIVER=${STORAGE_DRIVER}
      - RELEASE_SIGNING_PUBLIC_KEY=${RELEASE_SIGNING_PUBLIC_KEY}
    depends_on:
      - postgres
    networks:
      - app_network

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: always
    command: npm run worker:prod
    environment:
      - APP_ENV=${APP_ENV}
      - PORT=${PORT}
      - APP_URL=${APP_URL}
      - API_URL=${API_URL}
      - MARKETING_URL=${MARKETING_URL}
      - DATABASE_URL=postgresql://bricks_seo:${POSTGRES_PASSWORD}@postgres:5432/bricks_seo_platform
      - APP_ENCRYPTION_KEYS=${APP_ENCRYPTION_KEYS}
      - LICENSE_KEY_PEPPER=${LICENSE_KEY_PEPPER}
      - PADDLE_ENV=${PADDLE_ENV}
      - PADDLE_API_KEY=${PADDLE_API_KEY}
      - PADDLE_WEBHOOK_SECRET=${PADDLE_WEBHOOK_SECRET}
      - PADDLE_WEBHOOK_TOLERANCE_SECONDS=${PADDLE_WEBHOOK_TOLERANCE_SECONDS}
      - PADDLE_CLIENT_TOKEN=${PADDLE_CLIENT_TOKEN}
      - AUTO_CANCEL_SUBSCRIPTION_ON_REFUND=${AUTO_CANCEL_SUBSCRIPTION_ON_REFUND}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER}
      - EMAIL_FROM=${EMAIL_FROM}
      - ADMIN_ALERT_EMAIL=${ADMIN_ALERT_EMAIL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - STORAGE_DRIVER=${STORAGE_DRIVER}
      - RELEASE_SIGNING_PUBLIC_KEY=${RELEASE_SIGNING_PUBLIC_KEY}
    depends_on:
      - postgres
      - api
    networks:
      - app_network

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: always
    # No published ports and no TLS here: EasyPanel's own proxy terminates
    # HTTPS for account.bricksseo.com and forwards to this container's port 80
    # over the internal network — set that mapping in EasyPanel's Domains tab.
    depends_on:
      - api
    networks:
      - app_network

volumes:
  pgdata:

networks:
  app_network:
