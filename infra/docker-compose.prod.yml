services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: bricks_seo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bricks_seo_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: always
    environment:
      # Every var below is set in EasyPanel's Environment tab (it becomes a real
      # process env var before `docker compose up` runs, so ${...} resolves from there).
      - APP_ENV
      - PORT
      - APP_URL
      - API_URL
      - MARKETING_URL
      # Always the compose-internal postgres container in prod, regardless of what DATABASE_URL is set to in the panel
      - DATABASE_URL=postgresql://bricks_seo:${POSTGRES_PASSWORD}@postgres:5432/bricks_seo_platform
      - APP_ENCRYPTION_KEYS
      - LICENSE_KEY_PEPPER
      - PADDLE_ENV
      - PADDLE_API_KEY
      - PADDLE_WEBHOOK_SECRET
      - PADDLE_WEBHOOK_TOLERANCE_SECONDS
      - PADDLE_CLIENT_TOKEN
      - AUTO_CANCEL_SUBSCRIPTION_ON_REFUND
      - EMAIL_PROVIDER
      - EMAIL_FROM
      - ADMIN_ALERT_EMAIL
      - RESEND_API_KEY
      - STORAGE_DRIVER
      - RELEASE_SIGNING_PUBLIC_KEY
    depends_on:
      - postgres
    networks:
      - app_network

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: always
    command: npm run worker:prod
    environment:
      - APP_ENV
      - PORT
      - APP_URL
      - API_URL
      - MARKETING_URL
      - DATABASE_URL=postgresql://bricks_seo:${POSTGRES_PASSWORD}@postgres:5432/bricks_seo_platform
      - APP_ENCRYPTION_KEYS
      - LICENSE_KEY_PEPPER
      - PADDLE_ENV
      - PADDLE_API_KEY
      - PADDLE_WEBHOOK_SECRET
      - PADDLE_WEBHOOK_TOLERANCE_SECONDS
      - PADDLE_CLIENT_TOKEN
      - AUTO_CANCEL_SUBSCRIPTION_ON_REFUND
      - EMAIL_PROVIDER
      - EMAIL_FROM
      - ADMIN_ALERT_EMAIL
      - RESEND_API_KEY
      - STORAGE_DRIVER
      - RELEASE_SIGNING_PUBLIC_KEY
    depends_on:
      - postgres
      - api
    networks:
      - app_network

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: always
    # No published ports and no TLS here: EasyPanel's own proxy terminates
    # HTTPS for account.bricksseo.com and forwards to this container's port 80
    # over the internal network — set that mapping in EasyPanel's Domains tab.
    depends_on:
      - api
    networks:
      - app_network

volumes:
  pgdata:

networks:
  app_network:
