services:
  postgres:
    image: postgres:15-alpine
    restart: always
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: bricks_seo
      POSTGRES_DB: bricks_seo_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: always
    # Loads every var directly from the repo-root .env file EasyPanel writes from the
    # Environment tab (compose-time ${VAR} substitution was not resolving on this host).
    env_file:
      - ../.env
    depends_on:
      - postgres
    networks:
      - app_network

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: always
    command: npm run worker:prod
    env_file:
      - ../.env
    depends_on:
      - postgres
      - api
    networks:
      - app_network

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: always
    # No published ports and no TLS here: EasyPanel's own proxy terminates
    # HTTPS for account.bricksseo.com and forwards to this container's port 80
    # over the internal network — set that mapping in EasyPanel's Domains tab.
    depends_on:
      - api
    networks:
      - app_network

volumes:
  pgdata:

networks:
  app_network:
